[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csirt-veille-api"
version = "0.2.1"
description = "Collecte RSS sobre et API de veille CSIRT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34.2,<1",
  "httpx>=0.28.1,<0.29",
  "defusedxml>=0.7.1,<0.8",
  "anyio>=4.8,<5",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8.3.5,<9"]
analysis = ["pandas>=2.2,<3", "ipykernel>=6,<8", "matplotlib>=3.9,<4"]

[project.scripts]
csirt-collector = "csirt.collector:main"

[tool.setuptools.packages.find]
include = ["csirt*"]

[tool.setuptools.package-data]
csirt = ["sources.toml", "web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
